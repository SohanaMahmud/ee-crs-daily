# Runs ee-crs-daily on GitHub's servers every day at 18:00 Montréal time. No laptop needed.
# Secrets (repo Settings > Secrets and variables > Actions):
#   CRS_CONFIG_JSON  the whole config.json (source.type "drive", see config.cloud.example.json)
#   GDRIVE_SA_JSON   the Google service account key (JSON) that can read the Pervez and Sohana folders
name: Express Entry daily CRS

on:
  schedule:
    # GitHub can delay or drop scheduled runs, especially on the hour, so there are two tries each day:
    # a main run at 18:07 Montréal time and a backup at 18:47 that only sends if the main run didn't.
    # Each pair covers summer time (EDT, UTC-4: 22:xx UTC) and winter time (EST, UTC-5: 23:xx UTC).
    - cron: "7 22 * * *"
    - cron: "7 23 * * *"
    - cron: "47 22 * * *"
    - cron: "47 23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print the tables in the log (no email)"
        type: boolean
        default: true
      if_not_sent:
        description: "Skip if today's email was already sent (used by the 18:00 trigger)"
        type: boolean
        default: false

concurrency: crs-daily

permissions:
  contents: read
  actions: write   # read and upload the "sent today" marker

jobs:
  crs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Only the schedule that falls in Montréal's 18:00 hour today goes ahead, and only if today's email
      # hasn't been sent yet (a "sent-<date>" marker is uploaded after each real send).
      - name: Is it the 18:00 run in Montréal, and not sent yet today?
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          IF_NOT_SENT: ${{ github.event_name == 'workflow_dispatch' && inputs.if_not_sent }}
        run: |
          today=$(TZ=America/Toronto date +%F)
          echo "today=$today" >> "$GITHUB_OUTPUT"
          sent=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/actions/artifacts?name=sent-$today" | jq '.total_count // 0')
          if [ "$EVENT" != "schedule" ]; then
            if [ "$IF_NOT_SENT" = "true" ] && [ "$sent" -gt 0 ]; then echo "Already sent today ($today)."; echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi
            exit 0
          fi
          want=$(TZ=UTC date -d "TZ=\"America/Toronto\" $today 18:00" +%-H)
          got=$(echo "$SCHEDULE" | awk '{print $2}')
          echo "18:00 Montréal is $want:00 UTC today; this schedule is $got:xx UTC"
          if [ "$want" != "$got" ]; then echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$sent" -gt 0 ]; then echo "Already sent today ($today)."; echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.gate.outputs.go == 'true'
        run: |
          npm ci --omit=dev --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Write config and key from secrets
        if: steps.gate.outputs.go == 'true'
        env:
          CRS_CONFIG_JSON: ${{ secrets.CRS_CONFIG_JSON }}
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
        run: |
          umask 077
          printf '%s' "$CRS_CONFIG_JSON" > config.json
          printf '%s' "$GDRIVE_SA_JSON" > service-account.json
          node -e "JSON.parse(require('fs').readFileSync('config.json'))" || { echo "CRS_CONFIG_JSON is not valid JSON"; exit 1; }

      - name: Run the official calculator and email the tables
        if: steps.gate.outputs.go == 'true'
        env:
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
        run: node crs-daily.js $DRY

      - name: Mark today's email as sent
        if: success() && steps.gate.outputs.go == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: echo "sent" > sent.txt

      - uses: actions/upload-artifact@v4
        if: success() && steps.gate.outputs.go == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        with:
          name: sent-${{ steps.gate.outputs.today }}
          path: sent.txt
          retention-days: 3

      - name: Remove secrets from the runner
        if: always()
        run: rm -f config.json service-account.json
